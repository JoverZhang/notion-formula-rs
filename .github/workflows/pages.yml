name: CI + Deploy Vite demo to GitHub Pages

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_IMAGE: notion-formula-rs-ci:local

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.CI_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run checks and tests in CI image
        run: |
          docker run --rm --ipc=host \
            -e CI=true \
            -v "$PWD:/work" \
            -w /work \
            "$CI_IMAGE" \
            just verify

  deploy:
    name: Deploy Pages
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.CI_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Vite in CI image
        run: |
          docker run --rm \
            -e GITHUB_PAGES=true \
            -v "$PWD:/work" \
            -w /work \
            "$CI_IMAGE" \
            just build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/vite/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
