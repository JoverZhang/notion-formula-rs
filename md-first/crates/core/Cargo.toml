[package]
name = "md-first-core"
version = "0.1.0"
edition = "2024"
description = "Markdown inputs, preprocessor interfaces, dispatch and generated outputs"
license = "Apache-2.0"

[dependencies]
glob = "0.3"
prettyplease = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
pulldown-cmark = { version = "0.13", default-features = false }
syn = { version = "2", features = ["full", "visit"] }
toml = "1"
