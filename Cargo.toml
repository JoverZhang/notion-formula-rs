[workspace]
members = [
    "builtin_fn_macros",
    "builtin_fn",
    "analyzer",
    "evaluator",
    "formula_engine",
    "analyzer_wasm",
    "ide",
    "md-first",
    "md-first/crates/core",
    "md-first/crates/preprocessor",
    "tools/spec-codegen",
    "tools/spec-codegen/header-support",
]

resolver = "2"

[workspace.metadata.md-first]
include = ["md-first/docs/specs/README.md", "docs/specs/formula-engine.md"]
exclude = []
